syntax = "proto2";

option optimize_for = SPEED;

import "osi_version.proto";
import "osi_common.proto";
import "osi_sensorviewconfiguration.proto";
import "osi_antenna.proto";

package osi3;

//
// \brief Radar coherent processing interval (CPI) data.
//
// DRAFT PROPOSAL (osi-hfss). Interface between the radar signal generator
// and the radar signal processing (DSP) of a high-fidelity radar sensor
// model. The radar sensor model is split into three modules with well
// defined interfaces:
//
// \arg \b Environment \b simulation: delivers the antenna-free propagation
// paths as \c SensorView::radar_sensor_view (
// \c RadarSensorView::reflection with
// \c RadarSensorView::Reflection::polarimetric_response, departure and
// arrival angles), for
// \c RadarSensorViewConfiguration::antenna_application
// \c ANTENNA_APPLICATION_SENSOR_MODEL.
// \arg \b Signal \b generator: consumes the \c SensorView (reflections and
// \c RadarSensorViewConfiguration::antenna_model) and produces
// \c RadarCpiData. It applies the antenna model, the waveform and the MIMO
// scheme, and adds noise, i.e. it produces the samples the radar front
// end would digitize.
// \arg \b DSP: consumes \c RadarCpiData and produces \c SensorData (e.g.
// \c FeatureData::radar_sensor detections). It only sees what radar
// firmware would see: the CPI data cube and its metadata.
//
// The signal generator is a contract, not a model defined by OSI: its
// configuration (waveform parameters, transmit power, noise figure, MIMO
// scheme, output format, hardware effects) is specific to the simulated
// radar and owned by the provider of the signal generator. OSI only
// defines its input (\c SensorView) and its output (\c RadarCpiData).
//
// The CPI is independent of the modulation scheme (FMCW, PMCW, OFDM, ...)
// and of the MIMO multiplexing (TDM, CDM, DDM, ...). It describes the data
// cube only by its axes in physical units and by its channels. The waveform
// is radar configuration shared by the signal generator and the DSP of one
// radar (as the firmware of a real radar knows how it configured the front
// end), not part of OSI. A DSP that knows nothing but \c RadarCpiFrame can
// process virtual channels. Demultiplexing physical channels needs the
// radar specific waveform configuration.
//
// Common phase convention: a path with time of flight tau and Doppler
// shift f_D contributes g * exp(-j 2 pi f tau) * exp(+j 2 pi f_D t) to the
// samples, with f the instantaneous transmit frequency and t the time since
// \c RadarCpiFrame::start_time.
//
// \note The reflections of one \c RadarSensorView are a snapshot at the
// \c SensorView timestamp. The signal generator holds time of flight and
// Doppler shift of every path constant over the CPI.
//
message RadarCpiData
{
    // The interface version used by the sender.
    //
    // \rules
    // is_set
    // \endrules
    //
    optional InterfaceVersion version = 1;

    // The timestamp of the CPI data, i.e. the point in time the data
    // becomes available to the DSP.
    //
    // Zero time is arbitrary but must be identical for all messages.
    //
    // \rules
    // is_set
    // \endrules
    //
    optional Timestamp timestamp = 2;

    // The ID of the sensor, identical to \c SensorView::sensor_id of the
    // processed \c SensorView.
    //
    // \rules
    // is_set
    // \endrules
    //
    optional Identifier sensor_id = 3;

    // Radar view configuration valid for the CPI frames.
    //
    // Echo of \c RadarSensorView::view_configuration of the processed
    // \c SensorView. It contains the \c AntennaModel which the element
    // indices of \c RadarCpiFrame refer to.
    //
    optional RadarSensorViewConfiguration view_configuration = 4;

    // The coherent processing intervals produced in this time step.
    //
    // A radar may produce several CPIs per time step, e.g. with different
    // waveforms (modes).
    //
    repeated RadarCpiFrame cpi_frame = 5;
}

//
// \brief One coherent processing interval (CPI) of a radar.
//
// A complex data cube with the axes (channel, slow, fast) plus the metadata
// a DSP needs to interpret it: per-axis domain and bin coordinates, channel
// descriptors, transmitter positions, center frequency, scaling and noise
// floor. It does not describe the modulation scheme, see \c RadarCpiData.
//
// The CPI can carry
// \arg \b physical channels (raw RX chains, with the transmitters still
// multiplexed in a radar specific way) or \b virtual channels (one TX / RX
// pair each, after MIMO demodulation), and
// \arg the fast and slow axes in the \b signal domain (fast time, slow time)
// or in the \b spectral domain (range, Doppler).
//
// So the signal generator can model a front end that already does the MIMO
// demodulation or the range transform, and the DSP adapts by reading the
// metadata.
//
message RadarCpiFrame
{
    // Index of the CPI, counting up from 0 per sensor.
    //
    optional uint64 cpi_index = 1;

    // Start time of the CPI (slow time 0 of the channel with
    // \c RadarCpiChannel::time_offset 0).
    //
    // This is the time reference of the reflections the frame was generated
    // from.
    //
    optional Timestamp start_time = 2;

    // Fast axis (within one pulse repetition, e.g. a chirp).
    //
    // \c RadarCpiAxis::domain is \c DOMAIN_FAST_TIME or \c DOMAIN_RANGE.
    //
    // \rules
    // is_set
    // \endrules
    //
    optional RadarCpiAxis fast_axis = 3;

    // Slow axis (over pulse repetitions).
    //
    // \c RadarCpiAxis::domain is \c DOMAIN_SLOW_TIME or
    // \c DOMAIN_DOPPLER.
    //
    // \rules
    // is_set
    // \endrules
    //
    optional RadarCpiAxis slow_axis = 4;

    // Channels of the data cube, in the order of the channel axis of
    // \c data.
    //
    // All channels of one frame are of the same \c RadarCpiChannel::kind.
    //
    repeated RadarCpiChannel channel = 5;

    // Transmitters used during the CPI.
    //
    // Needed by the DSP to form virtual channels from physical channels.
    //
    repeated RadarCpiTransmitter transmitter = 6;

    // Center frequency of the transmitted signal.
    //
    // Converts Doppler shifts into range rates (monostatic:
    // range_rate = -doppler_shift * c / (2 * center_frequency)) and channel
    // positions into phase differences.
    //
    // Unit: Hz
    //
    // \rules
    // is_greater_than: 0
    // \endrules
    //
    optional double center_frequency = 7;

    // Receiver noise floor, i.e. the expected power E|n|^2 of the noise in
    // one cell of \c data.
    //
    // Reported even if the data is noise free. Updated with every domain
    // transform (e.g. multiplied by the window energy of a range or
    // Doppler transform).
    //
    // Unit: W
    //
    // \rules
    // is_greater_than_or_equal_to: 0
    // \endrules
    //
    optional double noise_power = 8;

    // Format of the samples.
    //
    optional SampleFormat sample_format = 9;

    // Encoding of the samples in \c data.
    //
    optional DataEncoding data_encoding = 10;

    // Scale factor from the encoded value to the physical amplitude.
    //
    // Physical amplitude = \c scale_factor * encoded value. The physical
    // amplitude is given such that |amplitude|^2 is the power.
    // Default is 1.
    //
    // Unit: W^0.5
    //
    optional double scale_factor = 11;

    // Data cube.
    //
    // Row-major with the index order [channel][slow][fast], i.e. the fast
    // axis is contiguous:
    // index = (i_channel * size(slow_axis) + i_slow) * size(fast_axis) +
    // i_fast.
    // Complex samples are stored as interleaved (I, Q) pairs, I first. All
    // values are little-endian.
    //
    // \note A CPI can be large (e.g. 12 channels x 64 slow x 256 fast
    // complex 32 bit float samples are 1.5 MB). Reduced precision encodings
    // (\c DATA_ENCODING_INT16) reduce the size, quantization effects are
    // then part of the data.
    //
    optional bytes data = 12;

    // ID of the radar specific configuration (waveform, mode) the frame was
    // produced with.
    //
    // The configuration is shared by the signal generator and the DSP of one
    // radar and is not described by OSI. The ID lets the DSP tell several
    // frames of one time step apart and select the configuration, e.g. for
    // demultiplexing \c RadarCpiChannel::KIND_PHYSICAL channels.
    //
    optional Identifier configuration_id = 13;

    // Sample format.
    //
    enum SampleFormat
    {
        // Unknown (must not be used in ground truth).
        //
        SAMPLE_FORMAT_UNKNOWN = 0;

        // Other (unspecified but known).
        //
        SAMPLE_FORMAT_OTHER = 1;

        // Complex IQ samples.
        //
        SAMPLE_FORMAT_COMPLEX_IQ = 2;

        // Real samples.
        //
        SAMPLE_FORMAT_REAL = 3;
    }

    // Encoding of one real value (or of one of I and Q) in \c data.
    //
    enum DataEncoding
    {
        // Unknown (must not be used in ground truth).
        //
        DATA_ENCODING_UNKNOWN = 0;

        // Other (unspecified but known).
        //
        DATA_ENCODING_OTHER = 1;

        // IEEE 754 32 bit float.
        //
        DATA_ENCODING_FLOAT32 = 2;

        // IEEE 754 64 bit float.
        //
        DATA_ENCODING_FLOAT64 = 3;

        // 16 bit signed integer.
        //
        DATA_ENCODING_INT16 = 4;
    }
}

//
// \brief One axis of a \c RadarCpiFrame.
//
// The coordinate of bin i is \c offset + \c spacing * i.
//
message RadarCpiAxis
{
    // Domain of the axis.
    //
    optional Domain domain = 1;

    // Number of bins.
    //
    // \rules
    // is_greater_than_or_equal_to: 1
    // \endrules
    //
    optional uint32 size = 2;

    // Bin spacing.
    //
    // Unit: s for \c DOMAIN_FAST_TIME and \c DOMAIN_SLOW_TIME, m for
    // \c DOMAIN_RANGE, Hz for \c DOMAIN_DOPPLER.
    //
    optional double spacing = 3;

    // Coordinate of bin 0.
    //
    // Unit: Same as \c spacing.
    //
    optional double offset = 4;

    // Window applied before the transform into this domain.
    //
    // \c WINDOW_NONE for the signal domains.
    //
    optional Window window = 5;

    // Domain of an axis.
    //
    // Common phase convention: see \c RadarCpiData.
    //
    enum Domain
    {
        // Unknown (must not be used in ground truth).
        //
        DOMAIN_UNKNOWN = 0;

        // Other (unspecified but known).
        //
        DOMAIN_OTHER = 1;

        // Fast axis: samples within one pulse repetition.
        //
        // The coordinate is the time since the start of the pulse
        // repetition.
        //
        DOMAIN_FAST_TIME = 2;

        // Fast axis: range compressed, range = c * tau / 2.
        //
        // How the range compression is done depends on the modulation
        // scheme and is not described by OSI. The coordinate is calibrated
        // for a stationary path: a path with time of flight tau and no
        // Doppler shift has its peak at range c * tau / 2.
        //
        // \note Doppler dependent shifts of the peak (e.g. the range-Doppler
        // coupling of FMCW, an apparent delay of tau - f_D / slope) are a
        // property of the waveform. They are neither corrected nor described
        // by the CPI.
        //
        DOMAIN_RANGE = 3;

        // Slow axis: pulse repetition index.
        //
        // The coordinate is the time since \c RadarCpiFrame::start_time
        // (plus \c RadarCpiChannel::time_offset).
        //
        DOMAIN_SLOW_TIME = 4;

        // Slow axis: forward DFT over slow time, zero Doppler centered (
        // fftshift).
        //
        // Positive Doppler shifts are approaching paths.
        //
        DOMAIN_DOPPLER = 5;
    }

    // Window function.
    //
    enum Window
    {
        // Unknown (must not be used in ground truth).
        //
        WINDOW_UNKNOWN = 0;

        // Other (unspecified but known).
        //
        WINDOW_OTHER = 1;

        // No window (rectangular).
        //
        WINDOW_NONE = 2;

        // Hann window.
        //
        WINDOW_HANN = 3;

        // Hamming window.
        //
        WINDOW_HAMMING = 4;

        // Blackman window.
        //
        WINDOW_BLACKMAN = 5;

        // Chebyshev window.
        //
        WINDOW_CHEBYSHEV = 6;

        // Taylor window.
        //
        WINDOW_TAYLOR = 7;
    }
}

//
// \brief One channel of a \c RadarCpiFrame.
//
message RadarCpiChannel
{
    // Index of the channel along the channel axis of
    // \c RadarCpiFrame::data.
    //
    optional uint32 index = 1;

    // Kind of the channel.
    //
    optional Kind kind = 2;

    // \c AntennaElement::index of the receiving element.
    //
    optional uint32 rx_index = 3;

    // \c AntennaElement::index of the transmitting element.
    //
    // Only set for \c KIND_VIRTUAL.
    //
    optional uint32 tx_index = 4;

    // Phase center of the channel in the sensor coordinate system.
    //
    // The RX element position for \c KIND_PHYSICAL, the sum of TX and RX
    // element positions for \c KIND_VIRTUAL.
    //
    // Unit: m
    //
    optional Vector3d position = 5;

    // Time of slow axis bin 0 of this channel relative to
    // \c RadarCpiFrame::start_time.
    //
    // E.g. the TDM slot of the transmitter of a virtual channel times the
    // chirp repetition interval. Needed for the compensation of the
    // Doppler-angle coupling of TDM-MIMO.
    //
    // Unit: s
    //
    optional double time_offset = 6;

    // Port of the receiving element that is digitized, i.e. the component
    // of \c AntennaModel::polarization_basis the channel receives.
    //
    // For an incident field E the channel receives J_rx[:, rx_port]^T * E,
    // with J_rx the \c JonesPattern of the element (see \c JonesPattern for
    // the reciprocity relation).
    //
    // Not set if the element has a single port or the port is unknown.
    //
    // \rules
    // is_less_than_or_equal_to: 1
    // \endrules
    //
    optional uint32 rx_port = 7;

    // Kind of a channel.
    //
    enum Kind
    {
        // Unknown (must not be used in ground truth).
        //
        KIND_UNKNOWN = 0;

        // Other (unspecified but known).
        //
        KIND_OTHER = 1;

        // One physical RX chain. The transmitters are multiplexed in a radar
        // specific way that is not described by OSI.
        //
        KIND_PHYSICAL = 2;

        // One TX / RX pair after MIMO demodulation.
        //
        KIND_VIRTUAL = 3;
    }
}

//
// \brief One transmitter used during a \c RadarCpiFrame.
//
message RadarCpiTransmitter
{
    // \c AntennaElement::index of the transmitting element.
    //
    optional uint32 index = 1;

    // Phase center of the element in the sensor coordinate system.
    //
    // Unit: m
    //
    optional Vector3d position = 2;

    // Feed of port 0 of the element in \c AntennaModel::polarization_basis.
    //
    // The element radiates E = J_tx * (excitation_0, excitation_1), with
    // J_tx its \c JonesPattern. Not set if unknown.
    //
    optional ComplexValue excitation_0 = 3;

    // Feed of port 1 of the element, see \c excitation_0.
    //
    optional ComplexValue excitation_1 = 4;
}
